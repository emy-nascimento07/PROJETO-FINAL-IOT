<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Central Supervisória - Lab IoT</title>
    <script src="https://jsdelivr.net"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 20px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1e293b;
        padding: 15px 25px;
        border-radius: 10px;
        margin-bottom: 20px;
      }
      .controles button {
        padding: 12px 20px;
        font-size: 15px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-left: 10px;
      }
      .btn-iniciar {
        background: #16a34a;
        color: white;
      }
      .btn-parar {
        background: #dc2626;
        color: white;
      }
      .painel-superior {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 20px;
        margin-bottom: 20px;
      }
      .box {
        background: #1e293b;
        padding: 20px;
        border-radius: 10px;
      }
      .eficiencia-valor {
        font-size: 48px;
        font-weight: bold;
        color: #38bdf8;
        margin: 10px 0;
      }
      .grid-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 15px;
      }
      .card {
        background: #1e293b;
        padding: 15px;
        border-radius: 8px;
        border-left: 5px solid #64748b;
      }
      .card.online {
        border-left-color: #22c55e;
      }
      .card.offline {
        border-left-color: #ef4444;
        opacity: 0.75;
      }
      .badge {
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
      }
      .badge.on {
        background: #14532d;
        color: #4ade80;
      }
      .badge.off {
        background: #7f1d1d;
        color: #fca5a5;
      }
      .chart-container {
        height: 220px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h2 style="margin: 0">🖥️ Central Supervisória Geral do Laboratório</h2>
        <small
          >Status Global:
          <strong id="status-global">CARREGANDO...</strong></small
        >
      </div>
      <div class="controles">
        <button class="btn-iniciar" onclick="enviarMacro('ATIVA')">
          ▶ INICIAR AULA
        </button>
        <button class="btn-parar" onclick="enviarMacro('ENCERRADA')">
          ⏹ ENCERRAR LABORATÓRIO (DESLIGAR TUDO)
        </button>
      </div>
    </header>

    <div class="painel-superior">
      <div class="box" style="text-align: center">
        <h3>Índice Global de Eficiência</h3>
        <div class="eficiencia-valor" id="indice-eficiencia">0%</div>
        <p id="resumo-online">0 de 7 bancadas online</p>
      </div>
      <div class="box">
        <h3 style="margin-top: 0">Comparativo de Telemetria das Bancadas</h3>
        <div class="chart-container">
          <canvas id="graficoLab"></canvas>
        </div>
      </div>
    </div>

    <div class="grid-cards" id="cards-container"></div>

    <script>
    const ctx = document.getElementById('graficoLab').getContext('2d');
    const grafico = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['G1 (Ar)', 'G2 (Luz)', 'G3 (Porta)', 'G4 (Réguas)', 'G5 (Monitor)', 'G6 (Exaustor)', 'G7 (Mestre)'],
        datasets: [{
          label: 'Status Operacional (1 = Online / 0 = Offline)',
          data: new Array(7).fill(0),
          backgroundColor: '#38bdf8'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { y: { beginAtZero: true, max: 1 } }
      }
    });

    async function enviarMacro(acao) {
      await fetch('/api/macro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ acao })
      });
      atualizarDashboard();
    }

    async function atualizarDashboard() {
      try {
        const res = await fetch('/api/status-geral');
        const data = await res.json();

        document.getElementById('status-global').innerText = data.modoGlobal;
        document.getElementById('indice-eficiencia').innerText = data.eficiencia + '%';

        const container = document.getElementById('cards-container');
        container.innerHTML = '';
        let onlineCount = 0;
        const dadosGrafico = [];

        data.grupos.forEach(g => {
          if (g.online) onlineCount++;
          dadosGrafico.push(g.online ? 1 : 0);

          let detalhes = '<small>Aguardando dados...</small>';
          if (g.id === 7 && g.dados.temperatura) {
            detalhes = `<p>Temp: ${g.dados.temperatura}°C | Umid: ${g.dados.umidade}% | Luz: ${g.dados.luminosidade}%</p>`;
          } else if (Object.keys(g.dados).length > 0) {
            detalhes = `<p><small>${JSON.stringify(g.dados)}</small></p>`;
          }

          container.innerHTML += `
            <div class="card ${g.online ? 'online' : 'offline'}">
              <div style="display:flex; justify-content:space-between;">
                <strong>Grupo ${g.id}</strong>
                <span class="badge ${g.online ? 'on' : 'off'}">${g.online ? 'ONLINE' : 'OFFLINE'}</span>
              </div>
              <p style="margin:5px 0;">${g.nome}</p>
              ${detalhes}
              <small>Comando Agendado: <strong>${g.comandoAtual}</strong></small>
            </div>
          `;
        });

        document.getElementById('resumo-online').innerText = `${onlineCount} de 7 bancadas online`;
        grafico.data.datasets.at(0).data = dadosGrafico;
        grafico.update();
      } catch (e) {
        console.error('Erro ao buscar status:', e);
      }
    }

    setInterval(atualizarDashboard, 2000);
    atualizarDashboard();
  </script>

  </body>
</html>
