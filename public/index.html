<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Computer Lab — Painel Supervisório Geral (G7)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Inter, Arial, sans-serif;
      }
      body {
        background-color: #f0fdf4;
        color: #1f2937;
        padding: 20px;
      }

      header {
        background: #ffffff;
        padding: 16px 24px;
        border-radius: 12px;
        border: 2px solid #22c55e;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.12);
        margin-bottom: 20px;
        gap: 16px;
      }
      .header-title {
        justify-self: start;
      }
      .header-title h1 {
        font-size: 19px;
        color: #111827;
      }
      .header-title p {
        font-size: 13px;
        color: #15803d;
        font-weight: 600;
        margin-top: 2px;
      }

      .kpi-global {
        justify-self: center;
        background: #f0fdf4;
        border: 1.5px solid #22c55e;
        padding: 10px 24px;
        border-radius: 8px;
        text-align: center;
        min-width: 210px;
      }
      .kpi-global span {
        font-size: 11px;
        color: #166534;
        font-weight: 700;
        text-transform: uppercase;
        display: block;
      }
      .kpi-global strong {
        display: block;
        font-size: 24px;
        color: #15803d;
        margin-top: 2px;
      }

      .master-controls {
        justify-self: end;
        display: flex;
        gap: 10px;
      }
      button {
        border: none;
        padding: 11px 16px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        transition: opacity 0.2s;
        white-space: nowrap;
      }
      button:hover {
        opacity: 0.9;
      }
      .btn-start {
        background-color: #16a34a;
        color: white;
      }
      .btn-stop {
        background-color: #dc2626;
        color: white;
      }

      .grid-grupos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }
      .card {
        background: #ffffff;
        border-radius: 10px;
        padding: 16px;
        border: 2px solid #22c55e;
        border-top: 6px solid #22c55e;
        box-shadow: 0 3px 8px rgba(34, 197, 94, 0.1);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .card.atencao {
        border-color: #eab308;
        border-top-color: #eab308;
      }
      .card.critico {
        border-color: #ef4444;
        border-top-color: #ef4444;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .card-header h3 {
        font-size: 15px;
        color: #1e293b;
      }
      .badge {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 12px;
        text-transform: uppercase;
      }
      .badge.online {
        background: #dcfce7;
        color: #166534;
        border: 1px solid #22c55e;
      }
      .badge.offline {
        background: #f1f5f9;
        color: #64748b;
        border: 1px solid #cbd5e1;
      }

      .card-body p {
        font-size: 13px;
        margin-bottom: 6px;
        color: #475569;
        display: flex;
        justify-content: space-between;
      }
      .card-body strong {
        color: #0f172a;
      }

      .card-footer {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #dcfce7;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
      }
      .btn-mini {
        padding: 5px 10px;
        font-size: 11px;
        border-radius: 4px;
        background: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
      }
      .btn-mini.stop {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
      }

      .bottom-section {
        background: #ffffff;
        border-radius: 12px;
        padding: 16px 20px;
        border: 2px solid #22c55e;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.12);
      }
      .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .chart-header h2 {
        font-size: 16px;
        color: #1e293b;
      }
      .legend {
        display: flex;
        gap: 16px;
        font-size: 12px;
        font-weight: 600;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot-green {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #16a34a;
        display: inline-block;
      }
      .dot-blue {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #2563eb;
        display: inline-block;
      }

      .chart-container {
        position: relative;
        height: 220px;
        width: 100%;
      }
      canvas {
        width: 100%;
        height: 220px;
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-title">
        <h1>Smart Computer Lab — Painel Supervisório Geral (G7)</h1>
        <p id="status-rede">Rede Local (LAN) • 0/7 Bancadas Online</p>
      </div>

      <div class="kpi-global">
        <span>Índice Global de Eficiência</span>
        <strong id="eficiencia-valor">0%</strong>
      </div>

      <div class="master-controls">
        <button class="btn-start" id="btnIniciar">▶ INICIAR AULA</button>
        <button class="btn-stop" id="btnEncerrar">
          ⏹ ENCERRAR LABORATÓRIO (DESLIGAR TUDO)
        </button>
      </div>
    </header>

    <section class="grid-grupos" id="grid-cards"></section>

    <section class="bottom-section">
      <div class="chart-header">
        <h2>Gráfico Comparativo em Tempo Real (220px)</h2>
        <div class="legend">
          <span><i class="dot-green"></i> Temperatura (°C)</span>
          <span><i class="dot-blue"></i> Variável Principal</span>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="graficoLab"></canvas>
      </div>
    </section>

    <script>
      // API_URL: vazio = usa o mesmo host/porta do servidor que serviu esta página
      var API_URL = "";

      var gruposPadrao = {
        grupo_01: { nome: "Climatização (HVAC)", online: false, dados: null },
        grupo_02: {
          nome: "Iluminação Anti-Reflexo",
          online: false,
          dados: null,
        },
        grupo_03: { nome: "Controle de Acesso", online: false, dados: null },
        grupo_04: { nome: "Réguas AC Notebooks", online: false, dados: null },
        grupo_05: {
          nome: "Conforto Acústico / Emerg.",
          online: false,
          dados: null,
        },
        grupo_06: {
          nome: "Qualidade do Ar / Exaustão",
          online: false,
          dados: null,
        },
        grupo_07: {
          nome: "Console Mestre (Professor)",
          online: false,
          dados: null,
        },
      };

      function enviarComando(grupoId, comando) {
        fetch(API_URL + "/api/comando", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ alvo: grupoId, comando: comando }),
        }).then(function (res) {
          return res.json();
        }).then(function(data) {
          alert("Comando " + comando + " agendado para " + grupoId.toUpperCase() + "!\nO ESP32 vai receber na próxima telemetria (~2s).");
        }).catch(function() {
          alert("Erro ao enviar comando. Verifique se o server.js está rodando.");
        });
      }

      function enviarComandoGeral(comando) {
        fetch(API_URL + "/api/comando-geral", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ comando: comando }),
        }).then(function (res) {
          return res.json();
        }).then(function(data) {
          alert("COMANDO MESTRE " + comando + " enviado!\nTodos os ESP32 vão receber na próxima telemetria (~2s).");
        }).catch(function() {
          alert("Erro ao enviar macro. Verifique se o server.js está rodando.");
        });
      }

      document
        .getElementById("btnIniciar")
        .addEventListener("click", function () {
          enviarComandoGeral("LIGAR");
        });

      document
        .getElementById("btnEncerrar")
        .addEventListener("click", function () {
          enviarComandoGeral("PARAR");
        });

      function renderizarCards(gruposObj) {
        var grid = document.getElementById("grid-cards");
        grid.innerHTML = "";

        Object.keys(gruposObj).forEach(function (id) {
          var g = gruposObj[id];
          var d = g.dados;

          var classeAlerta = "";
          if (d && d.status_alerta === "ATENCAO") classeAlerta = "atencao";
          if (d && d.status_alerta === "CRITICO") classeAlerta = "critico";

          var badgeClass = g.online ? "online" : "offline";
          var badgeText = g.online ? "ONLINE" : "OFFLINE";

          var temp = d ? d.temperatura + " °C" : "--";
          var umid = d ? d.umidade + " %" : "--";
          var varNome = d ? d.variavel_principal_nome : "Variável Principal";
          var varValor = d ? d.variavel_principal_valor : "--";
          var rele = d ? (d.rele_ativo ? "LIGADO" : "DESLIGADO") : "--";
          var ip = d ? d.ip_local : "Aguardando IP";
          var mac = d && d.mac_address ? d.mac_address : "--";
          var fw = d && d.firmware_versao ? d.firmware_versao : "v1.0-LAN";

          var cardDiv = document.createElement("div");
          cardDiv.className = "card " + classeAlerta;
          cardDiv.innerHTML =
            "<div>" +
            '<div class="card-header">' +
            "<h3>" +
            id.toUpperCase() +
            ": " +
            g.nome +
            "</h3>" +
            '<span class="badge ' +
            badgeClass +
            '">' +
            badgeText +
            "</span>" +
            "</div>" +
            '<div class="card-body">' +
            "<p><span>IP / MAC:</span> <strong>" +
            ip +
            " (" +
            mac +
            ")</strong></p>" +
            "<p><span>Temp / Umid:</span> <strong>" +
            temp +
            " | " +
            umid +
            "</strong></p>" +
            "<p><span>" +
            varNome +
            ":</span> <strong>" +
            varValor +
            "</strong></p>" +
            "<p><span>Relé / OTA:</span> <strong>" +
            rele +
            " (" +
            fw +
            ")</strong></p>" +
            "</div>" +
            "</div>" +
            '<div class="card-footer">' +
            "<span>Status: <strong>" +
            (d ? d.status_alerta : "AGUARDANDO") +
            "</strong></span>" +
            "<div>" +
            '<button class="btn-mini btn-ligar-card">Ligar</button> ' +
            '<button class="btn-mini stop btn-parar-card">Parar</button>' +
            "</div>" +
            "</div>";

          cardDiv
            .querySelector(".btn-ligar-card")
            .addEventListener("click", function () {
              enviarComando(id, "LIGAR");
            });
          cardDiv
            .querySelector(".btn-parar-card")
            .addEventListener("click", function () {
              enviarComando(id, "PARAR");
            });

          grid.appendChild(cardDiv);
        });
      }

      function desenharGraficoOffline(historico) {
        var canvas = document.getElementById("graficoLab");
        var ctx = canvas.getContext("2d");
        canvas.width = canvas.parentElement.clientWidth || 800;
        canvas.height = 220;

        var w = canvas.width;
        var h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 1;
        for (var i = 1; i <= 4; i++) {
          var y = (h / 5) * i;
          ctx.beginPath();
          ctx.moveTo(40, y);
          ctx.lineTo(w - 20, y);
          ctx.stroke();
        }

        if (!historico || historico.length < 2) {
          ctx.fillStyle = "#64748b";
          ctx.font = "13px sans-serif";
          ctx.fillText(
            "Aguardando pacotes JSON dos ESP32 para plotar curvas...",
            50,
            110,
          );
          return;
        }

        var dados = historico.slice(-20);
        var stepX = (w - 70) / (dados.length - 1);

        ctx.strokeStyle = "#16a34a";
        ctx.lineWidth = 3;
        ctx.beginPath();
        dados.forEach(function (item, idx) {
          var x = 45 + idx * stepX;
          var val = Math.min(Math.max(item.temperatura || 20, 0), 50);
          var y = h - 25 - (val / 50) * (h - 45);
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        ctx.strokeStyle = "#2563eb";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        dados.forEach(function (item, idx) {
          var x = 45 + idx * stepX;
          var val = Math.min(
            Math.max(item.variavel_principal_valor || 0, 0),
            1600,
          );
          var y = h - 25 - (val / 1600) * (h - 45);
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        ctx.fillStyle = "#64748b";
        ctx.font = "11px sans-serif";
        dados.forEach(function (item, idx) {
          if (idx % 3 === 0) {
            var x = 35 + idx * stepX;
            ctx.fillText(item.timestamp, x, h - 6);
          }
        });
      }

      renderizarCards(gruposPadrao);
      desenharGraficoOffline(null);

      function atualizarDashboard() {
        fetch(API_URL + "/api/status-geral")
          .then(function (res) {
            return res.json();
          })
          .then(function (statusData) {
            document.getElementById("eficiencia-valor").innerText =
              statusData.eficiencia_global + "%";
            document.getElementById("status-rede").innerText =
              "Rede Local (LAN) • " +
              statusData.bancadas_online +
              "/7 Bancadas Online";
            renderizarCards(statusData.grupos);
            desenharGraficoOffline(statusData.historico);
          })
          .catch(function () {
            document.getElementById("status-rede").innerText =
              "⚠️ Servidor offline — verifique node server.js";
          });
      }

      setInterval(atualizarDashboard, 2000);
      atualizarDashboard();
    </script>
  </body>
</html>
